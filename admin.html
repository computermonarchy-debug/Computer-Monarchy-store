<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Computer Monarchy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter}</style>
</head>
<body class="bg-gray-100">
<div class="max-w-4xl mx-auto px-4 py-12">
<div class="flex items-center gap-2 mb-6"><span class="text-3xl">👑</span><h1 class="text-3xl font-black text-[#0A2540]">Computer Monarchy Admin</h1></div>
<div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border-t-4 border-[#6C5CE7]">
<h3 class="font-black mb-4">Add Delivery Link After Balance Paid:</h3>
<form class="grid md:grid-cols-3 gap-3">
<input id="clientEmail" placeholder="Client email" class="border-2 rounded-lg px-4 py-3">
<input id="appName" placeholder="App name" class="border-2 rounded-lg px-4 py-3">
<input id="driveLink" placeholder="Google Drive link" class="border-2 rounded-lg px-4 py-3">
<button type="button" onclick="addClient()" class="md:col-span-3 bg-[#6C5CE7] text-white px-6 py-3 rounded-lg font-black">Add to Portal</button>
</form>
</div>
<div id="clientsList" class="space-y-3"></div>
</div>
<script>
function addClient(){
let email = document.getElementById('clientEmail').value;
let app = document.getElementById('appName').value;
let link = document.getElementById('driveLink').value;
if(!email ||!app ||!link) return alert('Fill all');
let clients = JSON.parse(localStorage.getItem('cm_clients') || '[]');
clients.push({email, app, link, date: new Date().toLocaleDateString()});
localStorage.setItem('cm_clients', JSON.stringify(clients));
loadClients();
alert('Added!');
document.getElementById('clientEmail').value='';
document.getElementById('appName').value='';
document.getElementById('driveLink').value='';
}
function loadClients(){
let clients = JSON.parse(localStorage.getItem('cm_clients') || '[]');
let html = clients.map(c=>`
<div class="bg-white p-5 rounded-xl shadow border-l-4 border-green-500">
<p class="font-black text-lg text-[#0A2540]">${c.app}</p>
<p class="text-sm text-gray-600">${c.email}</p>
<a href="${c.link}" target="_blank" class="text-[#6C5CE7] text-sm font-bold underline">Download Link</a>
<span class="text-xs text-gray-400 ml-2">${c.date}</span>
</div>
`).join('');
document.getElementById('clientsList').innerHTML = html || '<p class="text-gray-400 text-center">No clients yet</p>';
}
loadClients();
</script>
</body></html>
